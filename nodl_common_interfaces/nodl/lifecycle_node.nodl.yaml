---
# NoDL interface description for the standard ROS 2 lifecycle node base type.
#
# This file provides language-specific code generation metadata while keeping
# the shared ROS interface contract independent of any client library.
# It is registered as nodl://nodl_common_interfaces/lifecycle_node.

nodl_version: 2
description: Standard ROS 2 lifecycle node base interface

codegen:
  cpp:
    role: BASE_CLASS
    class: rclcpp_lifecycle::LifecycleNode
    header: rclcpp_lifecycle/lifecycle_node.hpp
  python:
    role: BASE_CLASS
    module: rclpy.lifecycle
    class: LifecycleNode
    publisher_method: create_lifecycle_publisher

include:
  - ref: local://node.nodl.yaml

publishers:
  - name: ~/transition_event
    type: lifecycle_msgs/msg/TransitionEvent
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

service_servers:
  - name: ~/change_state
    type: lifecycle_msgs/srv/ChangeState

  - name: ~/get_state
    type: lifecycle_msgs/srv/GetState

  - name: ~/get_available_states
    type: lifecycle_msgs/srv/GetAvailableStates

  - name: ~/get_available_transitions
    type: lifecycle_msgs/srv/GetAvailableTransitions

  - name: ~/get_transition_graph
    type: lifecycle_msgs/srv/GetAvailableTransitions
