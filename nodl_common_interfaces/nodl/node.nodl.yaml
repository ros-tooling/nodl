---
# NoDL interface description for the standard ROS 2 node base type.
#
# This file provides language-specific code generation metadata while keeping
# the shared ROS interface contract independent of any client library.
# It is registered in the ament index as nodl://nodl_common_interfaces/node.

nodl_version: 2
description: Standard ROS 2 node base interface

codegen:
  cpp:
    role: BASE_CLASS
    class: rclcpp::Node
    header: rclcpp/rclcpp.hpp
  python:
    role: BASE_CLASS
    module: rclpy.node
    class: Node

parameters:
  use_sim_time:
    type: bool
    default_value: false
    description: Use simulation time

publishers:
  - name: /rosout
    type: rcl_interfaces/msg/Log
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: RELIABLE

  - name: /parameter_events
    type: rcl_interfaces/msg/ParameterEvent
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: RELIABLE

service_servers:
  - name: ~/describe_parameters
    type: rcl_interfaces/srv/DescribeParameters

  - name: ~/get_parameters
    type: rcl_interfaces/srv/GetParameters

  - name: ~/get_parameter_types
    type: rcl_interfaces/srv/GetParameterTypes

  - name: ~/list_parameters
    type: rcl_interfaces/srv/ListParameters

  - name: ~/set_parameters
    type: rcl_interfaces/srv/SetParameters

  - name: ~/set_parameters_atomically
    type: rcl_interfaces/srv/SetParametersAtomically
