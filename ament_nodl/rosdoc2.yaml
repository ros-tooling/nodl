type: 'rosdoc2 config'
version: 1

---
settings:
    # The CMake macros have no API to extract, and the one Python module is documented in overview.md, so skip apidoc and doxygen.
    never_run_sphinx_apidoc: true
    generate_package_index: true

builders:
    - sphinx: {
        name: 'ament_nodl',
        output_dir: ''
    }
