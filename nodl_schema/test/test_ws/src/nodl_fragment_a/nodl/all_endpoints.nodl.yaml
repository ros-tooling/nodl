---
nodl_version: 2
parameters:
  speed:
    type: double
    default_value: 1.0
publishers:
  - name: /topic_a
    type: std_msgs/msg/String
    qos:
      history: SYSTEM_DEFAULT
      reliability: SYSTEM_DEFAULT
subscriptions:
  - name: /sub_a
    type: sensor_msgs/msg/Image
    qos:
      history: SYSTEM_DEFAULT
      reliability: SYSTEM_DEFAULT
service_servers:
  - name: /set_bool
    type: std_srvs/srv/SetBool
service_clients:
  - name: /trigger
    type: std_srvs/srv/Trigger
action_servers:
  - name: /navigate
    type: nav2_msgs/action/NavigateToPose
action_clients:
  - name: /spin
    type: nav2_msgs/action/Spin
