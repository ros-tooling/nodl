---
action_clients:
  - name: /s2/compute
    type: example_interfaces/action/Fibonacci
action_servers:
  - name: /s2/fib
    type: example_interfaces/action/Fibonacci
nodl_version: 2
parameters:
  max_count:
    additional_constraints: ''
    default_value: 10
    description: ''
    read_only: false
    type: int
  mode:
    additional_constraints: ''
    default_value: auto
    description: operating mode
    read_only: true
    type: string
  speed:
    additional_constraints: ''
    default_value: 1.5
    description: ''
    read_only: false
    type: double
publishers:
  - name: /s2/be_pub
    qos:
      durability: VOLATILE
      history: SYSTEM_DEFAULT
      liveliness: AUTOMATIC
      reliability: BEST_EFFORT
    type: std_msgs/msg/String
  - name: /s2/tl_pub
    qos:
      durability: TRANSIENT_LOCAL
      history: SYSTEM_DEFAULT
      liveliness: AUTOMATIC
      reliability: RELIABLE
    type: std_msgs/msg/String
service_clients:
  - name: /s2/multiply
    type: example_interfaces/srv/AddTwoInts
service_servers:
  - name: /s2/add
    type: example_interfaces/srv/AddTwoInts
subscriptions:
  - name: /s2/dl_sub
    qos:
      deadline_ns: 2000000000
      durability: VOLATILE
      history: SYSTEM_DEFAULT
      liveliness: AUTOMATIC
      reliability: RELIABLE
    type: std_msgs/msg/String
