---
nodl_version: 2
include:
  - ref: nodl://nodl_common_interfaces/lifecycle_node
publishers:
  - name: /lifecycle_status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE
subscriptions:
  - name: /lifecycle_command
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE
service_servers:
  - name: /lifecycle_add
    type: example_interfaces/srv/AddTwoInts
service_clients:
  - name: /lifecycle_remote_add
    type: example_interfaces/srv/AddTwoInts
action_clients:
  - name: /lifecycle_fibonacci
    type: example_interfaces/action/Fibonacci
