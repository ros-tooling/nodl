---
nodl_version: 2
include:
  - ref: nodl://nodl_common_interfaces/lifecycle_node
publishers:
  - name: /lifecycle_status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE
subscriptions:
  - name: cmd
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT
  - name: latched
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: RELIABLE
      durability: TRANSIENT_LOCAL
service_servers:
  - name: /lifecycle_add
    type: example_interfaces/srv/AddTwoInts
