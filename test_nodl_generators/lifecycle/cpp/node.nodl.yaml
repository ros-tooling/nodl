---
# LifecycleNode base class with a publisher, subscriptions (one of them latched), a service server and clients.

nodl_version: 2

include:
  - ref: nodl://nodl_common_interfaces/lifecycle_node

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

  - name: latched
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: RELIABLE
      durability: TRANSIENT_LOCAL

service_servers:
  - name: trigger
    type: std_srvs/srv/Trigger

service_clients:
  - name: ping
    type: std_srvs/srv/Trigger

action_clients:
  - name: count
    type: example_interfaces/action/Fibonacci
