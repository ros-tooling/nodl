---
# LifecycleNode base class with publishers, subscriptions, service servers and service clients.
# The latched publisher and subscription use TRANSIENT_LOCAL durability.

nodl_version: 2

include:
  - ref: nodl://nodl_common_interfaces/lifecycle_node

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

  - name: latched_status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: RELIABLE
      durability: TRANSIENT_LOCAL

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

  - name: latched
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: RELIABLE
      durability: TRANSIENT_LOCAL

service_servers:
  - name: trigger
    type: std_srvs/srv/Trigger

service_clients:
  - name: set_bool
    type: std_srvs/srv/SetBool
