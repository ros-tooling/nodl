---
# LifecycleNode base class with a parameter, a publisher, a subscription, a service server, an action server and both client kinds.

nodl_version: 2

include:
  - ref: nodl://nodl_common_interfaces/lifecycle_node

parameters:
  gain:
    type: double
    default_value: 1.0
    description: A gain that the node applies while it runs

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

service_servers:
  - name: trigger
    type: std_srvs/srv/Trigger

action_servers:
  - name: count
    type: example_interfaces/action/Fibonacci

service_clients:
  - name: add
    type: example_interfaces/srv/AddTwoInts

action_clients:
  - name: fibonacci
    type: example_interfaces/action/Fibonacci
