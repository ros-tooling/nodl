---
nodl_version: 2
parameters:
  max_speed:
    type: double
    default_value: 1.5
    description: Maximum speed in m/s
    validation:
      gt<>: [0.0]
  robot_name:
    type: string
    default_value: bot
    read_only: true
  enabled:
    type: bool
    default_value: true
  colour.r:
    type: double
    default_value: 0.8
  colour.g:
    type: double
    default_value: 0.4
  waypoints:
    type: double_array
    default_value: [1.0, 2.0]
