---
# All entity types together: publishers, subscriptions, service servers,
# service clients, action servers, action clients, and parameters.

nodl_version: 2

include:
  - ref: nodl://nodl_common_interfaces/node

parameters:
  max_speed:
    type: double
    default_value: 1.5
    description: Maximum speed in m/s
    validation:
      gt<>: [0.0]
  robot_name:
    type: string
    default_value: bot
    read_only: true

publishers:
  - name: status
    alias: state
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    alias: velocity
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

service_servers:
  - name: trigger
    alias: velocity
    type: std_srvs/srv/Trigger

service_clients:
  - name: set_bool
    alias: toggle
    type: std_srvs/srv/SetBool

action_servers:
  - name: fibonacci
    alias: sequence
    type: example_interfaces/action/Fibonacci

action_clients:
  - name: count
    alias: counter
    type: example_interfaces/action/Fibonacci
