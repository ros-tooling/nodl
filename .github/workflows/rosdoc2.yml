---
# SPDX-FileCopyrightText: 2026 Open Source Robotics Foundation, Inc.
# SPDX-License-Identifier: Apache-2.0
name: rosdoc2

# Validates that each package's standalone rosdoc2 build (the one docs.ros.org will run) succeeds and keeps
# succeeding. The combined nodl.readthedocs.io site is covered separately by docs.yml; this job exercises the
# per-package doc/ + rosdoc2.yaml sources in isolation, the way the ROS buildfarm builds them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede obsolete runs for the same PR; never cancel a push to main.
concurrency:
  group: rosdoc2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computes the packages to document. A pull request builds the packages it changes plus every package
  # that depends on one of them, since rosdoc2 imports a package and its dependencies to autodoc it.
  # Pushes to main, manual runs and changes to this workflow build every package.
  # A "documented package" is any package directory holding a rosdoc2.yaml.
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request ref is a merge commit, so its first parent is the base the diff is taken against.
          fetch-depth: 2
      - id: matrix
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import json, os, pathlib, subprocess, xml.etree.ElementTree as ET

          WORKFLOW = ".github/workflows/rosdoc2.yml"
          DEPEND_TAGS = {
              "build_depend", "build_export_depend", "buildtool_depend", "buildtool_export_depend",
              "depend", "doc_depend", "exec_depend",
          }

          # Test dependencies are left out, since documenting a package never runs its tests.
          # Package directory -> name, skipping packages under a COLCON_IGNORE (such as doc examples).
          ignored = [p.parent for p in pathlib.Path(".").rglob("COLCON_IGNORE")]
          packages = {}
          for manifest in sorted(pathlib.Path(".").rglob("package.xml")):
              if not any(i in manifest.parents for i in ignored):
                  packages[manifest.parent] = ET.parse(manifest).getroot().findtext("name")
          names = set(packages.values())
          dependencies = {
              name: {e.text.strip() for e in ET.parse(d / "package.xml").getroot() if e.tag in DEPEND_TAGS} & names
              for d, name in packages.items()
          }
          documented = {name for d, name in packages.items() if (d / "rosdoc2.yaml").is_file()}

          if os.environ["EVENT_NAME"] != "pull_request":
              selected = documented
          else:
              diff = subprocess.run(
                  ["git", "diff", "-z", "--name-only", "HEAD^1", "HEAD"], check=True, capture_output=True, text=True
              ).stdout.split("\0")
              diff = [f for f in diff if f]
              if WORKFLOW in diff:
                  selected = documented
              else:
                  # The innermost package directory owns a changed file. Dependents are added until a fixed point.
                  selected = set()
                  for f in diff:
                      owners = [(d, n) for d, n in packages.items() if pathlib.Path(f).is_relative_to(d)]
                      if owners:
                          selected.add(max(owners, key=lambda o: len(o[0].parts))[1])
                  size = -1
                  while size != len(selected):
                      size = len(selected)
                      selected |= {n for n, deps in dependencies.items() if deps & selected}
                  selected &= documented

          result = json.dumps(sorted(selected))
          print(f"packages: {result}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"packages={result}\n")

  rosdoc2:
    name: rosdoc2 build (${{ matrix.package }})
    needs: changes
    # An empty matrix fails the workflow, so a run with nothing to document skips this job instead.
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    # The jazzy image ships Python >= 3.11, so PEP 668 marks the system environment as externally managed.
    # rosdep installs pip dependencies globally as root, which pip then refuses; this opts those installs in.
    # Set at the job level so both `rosdep install` and the explicit `pip install` below inherit it.
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    container:
      # A ROS base image gives us ros2cli (ros2nodl imports it) and the ament build tooling already installed.
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/nodl

      - name: Install build tooling, dependencies, and rosdoc2
        shell: bash
        run: |
          apt-get update
          # doxygen is the C/C++ API extractor rosdoc2 runs for packages with an include/ dir (nodl_observe);
          # it is not in the ros-base image. Harmless for the Python/CMake-macro packages, which never invoke it.
          apt-get install -y python3-pip python3-colcon-common-extensions doxygen
          rosdep update
          # Skip the debian Sphinx (an exec_depend of nodl_docgen): pip cannot upgrade over it
          # (no RECORD file), and the pip install below provides a newer Sphinx that satisfies it anyway.
          rosdep install --from-paths src --ignore-src -y --skip-keys python3-sphinx
          # rosdoc2 imports each package to autodoc it, so it must share the workspace Python.
          # PEP 668 override comes from PIP_BREAK_SYSTEM_PACKAGES in the job env.
          pip install rosdoc2

      - name: Build the workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build

      - name: Build ${{ matrix.package }} docs with rosdoc2
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # rosdoc2 exits non-zero on a real failure; benign Sphinx warnings (for example rosdoc2's own
          # duplicate user-doc copy) do not fail the build, which is what we want as the gate.
          rosdoc2 build \
            --package-path "src/nodl/${{ matrix.package }}" \
            --output-directory "rosdoc2_output/${{ matrix.package }}" \
            --cross-reference-directory rosdoc2_cross

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosdoc2-${{ matrix.package }}
          path: rosdoc2_output/${{ matrix.package }}
          retention-days: 14
