---
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    # mcap-ros2-support is a pip rosdep; PEP 668 (Python >=3.11) needs this.
    env:
      PIP_BREAK_SYSTEM_PACKAGES: 1
    strategy:
      fail-fast: false
      matrix:
        # One job per distro — RMW variation is handled inside the job.
        # nodl_observe is ament_cmake (C++): a missing rosgraph_msgs/Node.msg is a
        # BUILD failure (loud), not a silent test-skip, so requires_node_msg is gone.
        ros: [humble, jazzy, kilted, lyrical, rolling]
        # ubuntu is mapped per distro; add a distro by extending both lists.
        include:
          - ros: humble
            ubuntu: jammy
          - ros: jazzy
            ubuntu: noble
          - ros: kilted
            ubuntu: noble
          - ros: lyrical
            ubuntu: resolute
          - ros: rolling
            ubuntu: resolute
    container:
      image: rostooling/setup-ros-docker:ubuntu-${{ matrix.ubuntu }}-latest
    steps:
      - name: Install pytest-colcon-ws
        # No rosdep key exists yet; install from source before the build.
        # 1) pip install --upgrade pip: the Jammy container ships pip 22
        #    which has a build-isolation bug that causes pyproject.toml
        #    [project] metadata to be ignored, producing an empty
        #    "UNKNOWN-0.0.0" wheel.  Upgrading pip first avoids this.
        #    The upgrade is allowed to fail (|| true) because the Noble
        #    containers install pip via Debian without a RECORD file.
        # 2) --ignore-installed: the Noble (jazzy/kilted) containers ship
        #    pluggy 1.4 and pytest 7.4 as Debian packages with no RECORD
        #    files, so pip cannot upgrade them in-place.
        #    --ignore-installed forces fresh copies to /usr/local.
        # 3) pytest>=8,<9: launch_testing on Humble, Jazzy, and Kilted uses
        #    the deprecated 'path' arg in its pytest_pycollect_makemodule
        #    hook, which was removed in pytest 9.
        run: |
          pip install --upgrade pip || true
          pip install --ignore-installed pluggy 'pytest>=8,<9' git+https://github.com/alistair-english/pytest-colcon-ws.git
      - name: Build and run all tests
        # One pass covers every RMW (call_for_each_rmw_implementation registers a
        # ctest per RMW; the integration test self-starts rmw_zenohd for zenoh).
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: nodl nodl_observe nodl_schema ros2nodl
          target-ros2-distro: ${{ matrix.ros }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs-${{ matrix.ros }}
          path: ros_ws/log
