---
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede obsolete runs for the same PR; never cancel a push to main.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            source:
              - '**'
              - '!**.md'
              - '!**/doc/**'

  build_and_test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    # mcap-ros2-support is a pip rosdep; PEP 668 (Python >=3.11) needs this.
    env:
      PIP_BREAK_SYSTEM_PACKAGES: 1
    strategy:
      fail-fast: false
      matrix:
        # One job per distro — RMW variation is handled inside the job.
        # nodl_observe is ament_cmake (C++): a missing rosgraph_msgs/Node.msg is a
        # BUILD failure (loud), not a silent test-skip, so requires_node_msg is gone.
        ros: [humble, jazzy, kilted, lyrical, rolling]
        # ubuntu is mapped per distro; add a distro by extending both lists.
        include:
          - ros: humble
            ubuntu: jammy
          - ros: jazzy
            ubuntu: noble
          - ros: kilted
            ubuntu: noble
          - ros: lyrical
            ubuntu: resolute
          - ros: rolling
            ubuntu: resolute
    container:
      image: rostooling/setup-ros-docker:ubuntu-${{ matrix.ubuntu }}-latest
    steps:
      - name: Build and run all tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.source == 'true'
        # One pass covers every RMW (call_for_each_rmw_implementation registers a
        # ctest per RMW; the integration test self-starts rmw_zenohd for zenoh).
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >-
            ament_nodl nodl nodl_observe nodl_schema ros2nodl test_ament_nodl
            nodl_generator_cpp test_nodl_generator_cpp nodl_tutorial_basics
          target-ros2-distro: ${{ matrix.ros }}
      - uses: actions/upload-artifact@v4
        if: >-
          always() &&
          (github.event_name != 'pull_request' || needs.changes.outputs.source == 'true')
        with:
          name: colcon-logs-${{ matrix.ros }}
          path: ros_ws/log
