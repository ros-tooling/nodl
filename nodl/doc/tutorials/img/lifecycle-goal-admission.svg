<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" role="img" aria-labelledby="title description">
  <title id="title">Runtime admission and handwritten validation</title>
  <desc id="description">The runtime rejects goals while inactive. Only admitted goals reach on_fibonacci_goal, which validates the order and accepts or rejects the goal. A separate on_fibonacci_cancel callback accepts client cancellation requests while a goal runs.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <g fill="#e2e8f0" stroke="#64748b"><rect x="15" y="5" width="245" height="185" rx="10"/><rect x="335" y="5" width="550" height="185" rx="10"/><rect x="335" y="215" width="550" height="90" rx="10"/><path d="M 15 48 H 260 M 335 48 H 885 M 335 255 H 885"/></g>
  <g font-family="monospace" font-weight="bold" font-size="18" text-anchor="middle" fill="#0f172a"><text x="137" y="33">NoDL runtime</text><text x="610" y="33">on_fibonacci_goal</text><text x="610" y="242">on_fibonacci_cancel</text></g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M 240 100 H 355"/><path d="M 565 100 H 695"/><path d="M 137 130 V 146"/><path d="M 460 130 V 163 H 625"/></g>
  <g fill="#f1f5f9" stroke="#64748b"><rect x="35" y="70" width="205" height="60" rx="8"/><rect x="355" y="70" width="210" height="60" rx="8"/><rect x="35" y="146" width="205" height="30" rx="7" fill="#fee2e2"/><rect x="695" y="70" width="170" height="60" rx="8" fill="#dcfce7"/><rect x="625" y="146" width="170" height="30" rx="7" fill="#fee2e2"/><rect x="274" y="86" width="45" height="25" rx="4"/><rect x="607" y="86" width="45" height="25" rx="4"/></g>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><text x="137" y="107">Server active?</text><text x="460" y="107">Valid order?</text><text x="780" y="107">Accept</text><text x="137" y="167">Reject if inactive</text><text x="710" y="167">Reject</text><text x="610" y="284">Accept cancellation request; execution checks it next</text></g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#0f172a"><text x="296" y="104">yes</text><text x="630" y="104">yes</text><text x="488" y="158">no</text></g>
</svg>
