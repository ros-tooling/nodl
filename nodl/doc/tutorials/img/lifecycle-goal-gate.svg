<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title description">
  <title id="title">Runtime-owned lifecycle admission</title>
  <desc id="description">The generated managed action server starts inactive. The runtime's sealed on_activate activates it. Its sealed on_deactivate closes admission and ends outstanding goals. No active flag or transition override is needed in the subclass.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M 280 80 H 320"/><path d="M 580 80 H 620"/></g>
  <g stroke="#64748b" fill="#f1f5f9">
    <rect x="20" y="25" width="260" height="140" rx="10"/>
    <rect x="320" y="25" width="260" height="140" rx="10" fill="#dcfce7"/>
    <rect x="620" y="25" width="260" height="140" rx="10"/>
  </g>
  <g stroke="#64748b"><path d="M 20 75 H 280"/><path d="M 320 75 H 580"/><path d="M 620 75 H 880"/></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
    <g font-family="monospace" font-size="16" font-weight="bold"><text x="150" y="56">ActiveOnlyActionServer</text><text x="450" y="56">on_activate (sealed)</text><text x="750" y="56">on_deactivate (sealed)</text></g>
    <g font-size="17"><text x="150" y="104">Created inactive</text><text x="150" y="135">Reject new goals</text><text x="450" y="104">Activate managed server</text><text x="450" y="135">Admit new goals</text><text x="750" y="104">Close admission</text><text x="750" y="135">End outstanding goals</text></g>
  </g>
  <rect x="55" y="185" width="790" height="30" rx="5" fill="#f1f5f9"/>
  <text x="450" y="205" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">NoDL runtime owns this behavior. No transition overrides in the handwritten subclass.</text>
</svg>
