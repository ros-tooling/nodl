---
$schema: http://json-schema.org/draft-07/schema#
$id: codegen_python.schema.yaml
title: NoDL Python codegen metadata
description: Metadata validated and consumed by nodl_generator_py.

type: object
additionalProperties: false
required: [role]

properties:
  role:
    description: |
      How this document's implementation participates in code generation.
      ``BASE_CLASS`` selects the generated class's base, while ``NO_GENERATE``
      excludes this document and its transitive includes from generation.
    enum: [BASE_CLASS, NO_GENERATE]
  module:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
  class:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
  publisher_method:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
    default: create_publisher
  lifecycle:
    description: |
      If the node is a lifecycle node, make the generated base class create its subscriptions when the node activates
      and destroy them when it deactivates, by declaring each as a ``nodl_runtime_py.managed.Managed`` member.
      The base class named by ``class`` must be or derive from ``nodl_runtime_py.lifecycle.LifecycleNode``,
      or the generated module fails when the node is constructed.
    type: boolean
    default: false

allOf:
  - if:
      properties:
        role:
          const: BASE_CLASS
    then:
      required: [module, class]
    else:
      not:
        anyOf:
          - required: [module]
          - required: [class]
          - required: [publisher_method]
          - required: [lifecycle]
