---
$schema: http://json-schema.org/draft-07/schema#
$id: codegen_python.schema.yaml
title: NoDL Python codegen metadata
description: Metadata validated and consumed by nodl_generator_py.

type: object
additionalProperties: false
required: [role]

properties:
  role:
    description: |
      How this document's implementation participates in code generation.
      ``BASE_CLASS`` selects the generated class's base, while ``NO_GENERATE``
      excludes this document and its transitive includes from generation.
    enum: [BASE_CLASS, NO_GENERATE]
  module:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
  class:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
  publisher_method:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
    default: create_publisher
  activation_gated:
    description: |
      If the node is a lifecycle node, make the generated base class wrap subscription and service server callbacks
      behind the activation gate so they only trigger callbacks when the node is active.
      The base class must be a ``nodl_runtime_py.lifecycle.LifecycleNode``, which exposes ``activation_gate``.
    type: boolean
    default: false

allOf:
  - if:
      properties:
        role:
          const: BASE_CLASS
    then:
      required: [module, class]
    else:
      not:
        anyOf:
          - required: [module]
          - required: [class]
          - required: [publisher_method]
          - required: [activation_gated]
