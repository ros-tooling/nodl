---
$schema: http://json-schema.org/draft-07/schema#
$id: codegen_cpp.schema.yaml
title: NoDL C++ codegen metadata
description: |
  Schema for the ``codegen.cpp`` object in NoDL documents.
  Validated by ``nodl_generator_cpp``, not ``nodl_schema``.
  The ``role`` field selects which of the variants applies:
  ``BASE_CLASS`` and ``NO_GENERATE`` describe included provider documents,
  and ``NODE`` describes the root document being generated.

oneOf:
  - $ref: '#/definitions/codegen_base_class'
  - $ref: '#/definitions/codegen_no_generate'
  - $ref: '#/definitions/codegen_node'

definitions:
  codegen_base_class:
    description: |
      An included document that provides the generated class's base.
    type: object
    additionalProperties: false
    required:
      - role
      - class
      - header
    properties:
      role:
        const: BASE_CLASS
      class:
        description: |
          Fully-qualified C++ class name to inherit from
          (e.g. ``rclcpp::Node``).
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_:]*$
      header:
        description: |
          C++ header to ``#include`` for the base class
          (e.g. ``rclcpp/rclcpp.hpp``).
        type: string
      publisher_type:
        description: |
          Fully-qualified C++ publisher class template that the base class's ``create_publisher`` returns,
          declared by ``header`` (e.g. ``rclcpp_lifecycle::LifecyclePublisher``).
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_:]*$
        default: rclcpp::Publisher

  codegen_no_generate:
    description: |
      An included document that has an existing implementation
      but does not provide the generated class's base.
      It excludes this document and its transitive includes from generation.
    type: object
    additionalProperties: false
    required:
      - role
    properties:
      role:
        const: NO_GENERATE

  codegen_node:
    description: |
      The root document being generated.
      Only valid on the root document.
    type: object
    additionalProperties: false
    required:
      - role
    properties:
      role:
        const: NODE
      namespace:
        description: |
          C++ namespace for the generated class and its parameter structs
          (e.g. ``my_pkg::nodes``).
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(::[A-Za-z_][A-Za-z0-9_]*)*$
      callback_groups:
        description: |
          Named callback groups for subscriptions and service servers generated by this root document.
          Endpoint names match their declarations exactly, before namespace resolution or remapping.
          Unassigned endpoints use the node's default callback group.
        type: object
        propertyNames:
          pattern: ^[a-z][a-z0-9_]*$
        additionalProperties:
          $ref: '#/definitions/callback_group'

  callback_group:
    type: object
    additionalProperties: false
    required:
      - type
    anyOf:
      - required: [subscriptions]
      - required: [service_servers]
    properties:
      type:
        type: string
        enum: [MUTUALLY_EXCLUSIVE, REENTRANT]
      subscriptions:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      service_servers:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
