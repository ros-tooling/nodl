---
$schema: http://json-schema.org/draft-07/schema#
$id: codegen_cpp.schema.yaml
title: NoDL C++ codegen metadata
description: |
  Schema for the ``codegen.cpp`` object in NoDL documents.
  Validated by ``nodl_generator_cpp``, not ``nodl_schema``.

type: object
additionalProperties: false
required:
  - role

properties:
  role:
    description: |
      How this document participates in code generation.
      On included documents, ``BASE_CLASS`` selects the generated class's base,
      while ``NO_GENERATE`` excludes this document and its transitive includes from generation.
      ``NODE`` is only valid on the root document being generated.
    enum: [BASE_CLASS, NO_GENERATE, NODE]

  class:
    description: |
      Fully-qualified C++ class name to inherit from
      (e.g. ``rclcpp::Node``).
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_:]*$

  header:
    description: |
      C++ header to ``#include`` for the base class
      (e.g. ``rclcpp/rclcpp.hpp``).
    type: string

  namespace:
    description: |
      C++ namespace for the generated class and its parameter structs
      (e.g. ``my_pkg::nodes``). Only valid with role ``NODE``.
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*(::[A-Za-z_][A-Za-z0-9_]*)*$

allOf:
  - if:
      properties:
        role:
          const: BASE_CLASS
    then:
      required:
        - class
        - header
    else:
      not:
        anyOf:
          - required: [class]
          - required: [header]
  - if:
      properties:
        role:
          const: NODE
    else:
      not:
        required: [namespace]
