---
# Tests publisher and subscription generation.
# The generator should scaffold /status publisher and /cmd_vel subscription,
# skipping all entities from the rclcpp_node include.

nodl_version: 2

include:
  - ref: test://rclcpp_node

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT
