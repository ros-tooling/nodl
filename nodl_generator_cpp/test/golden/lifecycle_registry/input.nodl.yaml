---
# Tests a lifecycle base class whose codegen.cpp sets lifecycle: true.
# The generator should register every endpoint kind with manage() instead of creating it in the constructor.

nodl_version: 2

include:
  - ref: test://runtime_lifecycle_node

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

service_servers:
  - name: trigger
    type: std_srvs/srv/Trigger

service_clients:
  - name: set_bool
    type: std_srvs/srv/SetBool
