---
# Tests base-class inheritance chain via the barrier system.
# The generator should inherit from rclcpp_lifecycle::LifecycleNode and skip
# all entities from both lifecycle_node and rclcpp_node (behind the barrier).

nodl_version: 2

include:
  - ref: test://rclcpp_lifecycle_node

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT
