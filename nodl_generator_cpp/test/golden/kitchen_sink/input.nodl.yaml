---
# Tests all entity types together: publishers, subscriptions,
# service servers, service clients, action servers, and action clients.

nodl_version: 2

include:
  - ref: test://rclcpp_node

parameters:
  max_speed:
    type: double
    default_value: 1.5
    description: Maximum speed in m/s
    validation:
      gt<>: [0.0]
  robot_name:
    type: string
    default_value: bot
    read_only: true

publishers:
  - name: status
    type: std_msgs/msg/String
    qos:
      history: KEEP_LAST
      depth: 10
      reliability: RELIABLE

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

service_servers:
  - name: trigger
    type: std_srvs/srv/Trigger

service_clients:
  - name: set_bool
    type: std_srvs/srv/SetBool

action_servers:
  - name: fibonacci
    type: example_interfaces/action/Fibonacci

action_clients:
  - name: navigate
    type: nav2_msgs/action/NavigateToPose
