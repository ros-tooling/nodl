---
# Lifecycle base class with a subscription and a service server.
# The generated callbacks are blocked while the node is inactive.

nodl_version: 2

include:
  - ref: test://rclcpp_lifecycle_node

subscriptions:
  - name: cmd_vel
    type: geometry_msgs/msg/Twist
    qos:
      history: KEEP_LAST
      depth: 1
      reliability: BEST_EFFORT

service_servers:
  - name: trigger
    type: std_srvs/srv/Trigger
