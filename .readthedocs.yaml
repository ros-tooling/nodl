# SPDX-FileCopyrightText: 2026 Open Source Robotics Foundation, Inc.
# SPDX-License-Identifier: Apache-2.0
# Read the Docs build configuration. See https://docs.readthedocs.io/en/stable/config-file/v2.html.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.12'

sphinx:
  configuration: nodl/doc/conf.py
  fail_on_warning: false

python:
  install:
    # The site renders a NoDL document with the nodl-node directive, so the extension and the loader it uses have to
    # be importable. Installed from the working tree ahead of nodl/doc, which requires them by name: pip finds those
    # requirements already satisfied instead of looking for packages that have no release on any index.
    - path: nodl_schema
    - path: nodl_sphinx
    - path: nodl/doc
      extra_requirements:
        - docs
