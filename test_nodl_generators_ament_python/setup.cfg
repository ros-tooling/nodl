[develop]
script_dir=$base/lib/test_nodl_generators_ament_python
[install]
install_scripts=$base/lib/test_nodl_generators_ament_python

# Registered with the ament index as echo_node_base.
[nodl_generate_py.echo_node_base]
nodl_file = nodl/echo_node.nodl.yaml

# The same document again, without registration, since a document registers once per package.
[nodl_generate_py.unindexed_echo_node_base]
nodl_file = nodl/echo_node.nodl.yaml
no_index = true

[nodl_generate_py.lifecycle_node_base]
nodl_file = nodl/lifecycle_node.nodl.yaml
resource_name = lifecycle_node

# composed_node includes status_mixin by source-tree path, so both are registered.
[nodl_generate_py.status_mixin_base]
nodl_file = nodl/status_mixin.nodl.yaml
resource_name = status_mixin

[nodl_generate_py.composed_node_base]
nodl_file = nodl/composed_node.nodl.yaml

[nodl_add_py_executable.echo_node]
target = test_nodl_generators_ament_python.echo_node:EchoNode

[nodl_add_py_executable.lifecycle_node]
target = test_nodl_generators_ament_python.lifecycle_node:LifecycleStatusNode
executor = rclpy.executors:MultiThreadedExecutor

[tool:pytest]
testpaths = test
